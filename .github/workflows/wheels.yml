name: Wheels

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: wheel (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            interpreter: python3.10
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            interpreter: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.13.3
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --locked
            --out dist
            -i ${{ matrix.interpreter }}

      - name: Install built wheel
        run: >-
          python -m pip install
          --force-reinstall
          --no-index
          --find-links dist
          pine-compat-runtime

      - name: Test installed wheel
        run: python -m pytest python/tests

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Build release manifest
        # Version normalization/classification is an explicit tool dependency.
        # Candidate tags must not become stable releases merely by matching v*.
        run: |
          python3 -m pip install -r scripts/requirements-release.txt
          python3 scripts/build_wheel_manifest.py --dist dist --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --expected-wheel-count 2

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel=$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["channel"])')
          flags=()
          case "$channel" in
            stable) ;;
            prerelease) flags+=(--prerelease --latest=false) ;;
            *) echo "Unsupported release channel: $channel" >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Pine Compat Runtime $GITHUB_REF_NAME" "${flags[@]}"
